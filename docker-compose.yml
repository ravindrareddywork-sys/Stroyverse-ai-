version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: storyverse_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - AI_PROVIDER=gemini
      - AI_MOCK_MODE=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-flash
      - SECRET_KEY=${SECRET_KEY:-storyverse-production-super-secret-key}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5000,http://localhost:80
    volumes:
      - backend_data:/app/instance

  frontend:
    image: nginx:alpine
    container_name: storyverse_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  backend_data:
